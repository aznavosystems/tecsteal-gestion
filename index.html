<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tecsteal Gestion</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#192e35;font:14px Inter,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:235px;background:#102b31;color:#c4d2d2;padding:30px 17px;display:flex;flex-direction:column;position:fixed;height:100vh}.brand{display:flex;gap:12px;align-items:center;color:white;font-weight:750;font-size:18px;padding:0 8px 34px}.logo{background:#c8e85b;color:#19332e;border-radius:10px;padding:11px;font-size:16px}.brand small{display:block;color:#92aaa9;font-size:10px;letter-spacing:1.5px;margin-top:3px}.navlabel{font-size:10px;letter-spacing:1.5px;color:#77918f;margin:15px 12px 8px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#bacbca;padding:12px;border-radius:8px;margin:3px 0}.nav button.active{background:#29464a;color:#e5fa9f;font-weight:600}.nav button span{display:inline-block;width:30px;font-size:16px}.sidebar-bottom{margin-top:auto;border-top:1px solid #345056;padding:18px 8px 0;font-size:12px;color:#a7bab8}.main{margin-left:235px;width:calc(100% - 235px)}.top{height:68px;border-bottom:1px solid #e4eaea;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 36px}.top .crumb{color:#84969a}.top strong{color:#263e43}.topright{display:flex;gap:16px;align-items:center}.demo{background:#fff6d9;color:#8c6d18;border-radius:6px;padding:7px 10px;font-size:11px;font-weight:700}.avatar{width:34px;height:34px;background:#d9e7e2;border-radius:50%;display:grid;place-items:center;font-weight:700}.content{padding:32px 36px;max-width:1600px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{color:#658073;font-size:11px;letter-spacing:1.5px;font-weight:750;text-transform:uppercase}h1{font-size:29px;letter-spacing:-1px;margin:8px 0;color:#172f35}h2{font-size:16px;margin:0;color:#1b3338}p{color:#819194;margin:0}.actions{display:flex;gap:10px}.btn{border:1px solid #dbe4e2;background:white;color:#29423f;border-radius:8px;padding:10px 14px;font-weight:600}.primary{background:#bddf56;border-color:#bddf56;color:#17352d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.card,.panel{background:white;border:1px solid #e3e9e8;border-radius:11px;box-shadow:0 2px 8px #1f403707}.card{padding:20px}.cardhead{display:flex;justify-content:space-between;color:#7e9091;font-size:12px}.icon{background:#eff6ea;color:#638244;padding:8px;border-radius:8px;font-size:15px}.value{font-size:25px;letter-spacing:-.7px;font-weight:700;margin:17px 0 7px}.value small{font-size:12px;color:#95a4a4;font-weight:500}.sub{font-size:11px;color:#8b9b9b}.positive{color:#4d9171}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:18px;margin-bottom:18px}.panel{padding:22px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panelhead p{font-size:12px;margin-top:5px}.legend{font-size:11px;color:#829396}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b9db55;margin:0 5px 0 12px}.dot.dark{background:#315a54}.chart{height:190px;display:flex;align-items:flex-end;gap:14px;border-bottom:1px solid #e8eded;background:repeating-linear-gradient(to top,transparent 0,transparent 46px,#eff3f2 47px);padding:0 8px}.group{flex:1;display:flex;gap:4px;align-items:flex-end;height:100%;position:relative}.bar{width:50%;background:#bbdf5a;border-radius:4px 4px 0 0}.bar.dark{background:#315c56}.months{display:flex;justify-content:space-around;color:#97a6a5;font-size:10px;margin-top:9px}.notice{background:#f6f9f2;border-radius:9px;padding:16px;margin-bottom:13px;display:flex;gap:12px}.notice b{display:block;margin-bottom:5px}.notice small{color:#829391}.circle{width:34px;height:34px;background:#e6efcf;color:#587b41;border-radius:9px;display:grid;place-items:center;flex:none}.link{background:none;border:0;color:#547d51;font-weight:700;font-size:12px;padding:0}.lower{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;color:#98a7a6;text-transform:uppercase;letter-spacing:.7px;font-weight:600;padding:10px;border-bottom:1px solid #edf1f0}td{padding:14px 10px;border-bottom:1px solid #f0f3f2;font-size:12px}td b{color:#263f40}.badge{font-size:10px;padding:6px 9px;border-radius:20px;background:#edf5df;color:#678a3f;white-space:nowrap}.badge.wait{background:#fff3da;color:#ac7829}.badge.late{background:#fbe9e5;color:#bb6659}.task{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #eef2f0;align-items:start}.task input{accent-color:#658b3a}.task b{font-size:12px}.task small{display:block;color:#97a5a4;margin-top:5px}.task.done b{text-decoration:line-through;color:#a5b2af}.full{margin-top:4px}.empty{padding:30px;color:#879894;text-align:center}.footer{font-size:11px;color:#9aa9a7;margin-top:24px}.modal{position:fixed;inset:0;background:#102d32aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:3}.modal.show{display:flex}.dialog{background:white;padding:26px;border-radius:14px;width:min(480px,100%)}.dialog h2{margin-bottom:8px}.dialog p{font-size:12px;margin-bottom:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#526b69;font-weight:600}input:not([type=checkbox]),select{width:100%;padding:10px;border:1px solid #dbe5e2;border-radius:7px;margin-top:6px;background:white}label.wide{grid-column:span 2}.modalbuttons{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:900px){.sidebar{width:68px;padding:25px 8px}.brand{padding:0 4px 30px}.brand div:not(.logo),.navlabel,.nav button em,.sidebar-bottom{display:none}.nav button{text-align:center;padding:12px 0}.nav button span{width:auto}.main{margin-left:68px;width:calc(100% - 68px)}.cards{grid-template-columns:repeat(2,1fr)}.grid,.lower{grid-template-columns:1fr}.content{padding:25px 20px}.top{padding:0 20px}}@media(max-width:550px){.heading{align-items:start;gap:15px;flex-direction:column}.cards{gap:10px}.card{padding:14px}.value{font-size:19px}.top .crumb{display:none}.panel{overflow:auto}.demo{font-size:9px}.chart{gap:7px}h1{font-size:25px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">T<span style="color:#6f963b">.</span></div><div>tecsteal<small>GESTION</small></div></div><div class="navlabel">ESPACE DE TRAVAIL</div><nav class="nav"><button data-page="overview" class="active"><span>◫</span><em>Tableau de bord</em></button><button data-page="invoices"><span>▤</span><em>Factures</em></button><button data-page="suppliers"><span>♧</span><em>Fournisseurs</em></button><button data-page="tasks"><span>✓</span><em>Tâches</em></button><button data-page="stats"><span>▥</span><em>Statistiques</em></button><button data-page="balance"><span>◈</span><em>Situation financière</em></button></nav><div class="sidebar-bottom">● &nbsp; Espace de démonstration<br><br>Vos données restent sur cet appareil.</div></aside><main class="main"><header class="top"><div class="crumb">Espace de travail &nbsp; / &nbsp; <strong id="crumb">Tableau de bord</strong></div><div class="topright"><span class="demo">DONNÉES FICTIVES</span><div class="avatar">F</div><strong>Fathi</strong></div></header><div class="content" id="content"></div></main></div><div class="modal" id="modal"><form class="dialog" id="invoiceForm"><h2>Nouvelle facture fournisseur</h2><p>Ajoutez une facture à la démonstration.</p><div class="fields"><label class="wide">Fournisseur<input name="supplier" required placeholder="Nom du fournisseur"></label><label>Numéro de facture<input name="number" required placeholder="FA-2026-001"></label><label>Montant TTC (DT)<input name="amount" type="number" min="0.001" step="0.001" required placeholder="0,000"></label><label>Date de facture<input name="date" type="date" required></label><label>Échéance<input name="due" type="date" required></label><label class="wide">Pièce jointe PDF (facultatif)<input name="pdf" type="file" accept="application/pdf,.pdf"><small style="display:block;color:#899b98;margin-top:6px;font-weight:400">PDF jusqu’à 2 Mo · conservé dans ce navigateur</small></label></div><div class="modalbuttons"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn primary">Ajouter la facture</button></div></form></div><script>
const initial=[{supplier:'Fournisseur Atlas',number:'FAC-2026-084',date:'2026-10-24',due:'2026-11-05',amount:2450,status:'À payer'},{supplier:'Services Méditerranée',number:'FAC-2026-079',date:'2026-10-20',due:'2026-11-02',amount:1180,status:'À vérifier'},{supplier:'Fournisseur Horizon',number:'FAC-2026-072',date:'2026-10-15',due:'2026-10-27',amount:840,status:'En retard'},{supplier:'Transport Express',number:'FAC-2026-068',date:'2026-10-11',due:'2026-10-25',amount:560,status:'Payée'}];let invoices=JSON.parse(localStorage.getItem('tecInvoices')||'null')||initial;let tasks=JSON.parse(localStorage.getItem('tecTasks')||'null')||[{name:'Vérifier la facture Services Méditerranée',info:'Comptabilité · Aujourd’hui',done:false},{name:'Préparer les paiements fournisseurs',info:'Fathi · Demain',done:false},{name:'Classer les factures du mois',info:'Administration · 31 octobre',done:false}];let page='overview';const content=document.getElementById('content');const money=n=>Number(n).toLocaleString('fr-TN',{minimumFractionDigits:3,maximumFractionDigits:3});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s.split('-').reverse().join('/');const badge=s=>`<span class="badge ${s==='En retard'?'late':s==='À vérifier'?'wait':''}">${esc(s)}</span>`;function table(){return `<table><thead><tr><th>Fournisseur</th><th>N° facture</th><th>Échéance</th><th>Montant TTC</th><th>Statut</th><th>Document</th><th>Action</th></tr></thead><tbody>${invoices.map(i=>`<tr><td><b>${esc(i.supplier)}</b></td><td>${esc(i.number)}</td><td>${date(i.due)}</td><td><b>${money(i.amount)} DT</b></td><td>${badge(i.status)}</td><td>${i.pdf ? `<button class="link" data-pdf="${invoices.indexOf(i)}">Télécharger PDF ↓</button>` : `<span style="color:#a3afad">—</span>`}</td><td><select aria-label="Statut de facture" data-status="${invoices.indexOf(i)}" style="width:auto;margin:0;padding:5px"><option ${i.status==='À payer'?'selected':''}>À payer</option><option ${i.status==='À vérifier'?'selected':''}>À vérifier</option><option ${i.status==='En retard'?'selected':''}>En retard</option><option ${i.status==='Payée'?'selected':''}>Payée</option></select></td></tr>`).join('')}</tbody></table>`}function taskList(){return tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="Terminer la tâche" data-task="${i}" ${t.done?'checked':''}><div><b>${esc(t.name)}</b><small>${esc(t.info)}</small></div></div>`).join('')}function chart(){let a=[43,55,50,63,59,75,71,81,68,86,73,92],b=[27,34,32,42,37,48,45,52,43,55,49,57];return `<div class="chart">${a.map((x,i)=>`<div class="group"><div class="bar" style="height:${x}%" title="Revenus illustratifs"></div><div class="bar dark" style="height:${b[i]}%" title="Dépenses illustratives"></div></div>`).join('')}</div><div class="months">${['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'].map(x=>`<span>${x}</span>`).join('')}</div>`}function heading(title,desc){return `<div class="heading"><div><div class="eyebrow">VOTRE ESPACE DE GESTION</div><h1>${title}</h1><p>${desc}</p></div><div class="actions"><button class="btn" id="reset">Réinitialiser la démo</button><button class="btn primary" id="add">＋ &nbsp; Ajouter facture / PDF</button></div></div>`}function stat(label,val,sub,icon){return `<div class="card"><div class="cardhead"><span>${label}</span><span class="icon">${icon}</span></div><div class="value">${val} <small>DT</small></div><div class="sub">${sub}</div></div>`}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let names={overview:'Tableau de bord',invoices:'Factures',suppliers:'Fournisseurs',tasks:'Tâches',stats:'Statistiques',balance:'Situation financière'};document.getElementById('crumb').textContent=names[page];let open=invoices.filter(i=>i.status!=='Payée').reduce((a,i)=>a+Number(i.amount),0);let html='';if(page==='overview'){html=heading('Bonjour Fathi 👋','Voici un aperçu de votre activité et de vos priorités.')+`<div class="cards">${stat('Chiffre d’affaires annuel','248 500,000','Exemple · année 2026','↗')}${stat('Dépenses annuelles','164 200,000','Exemple · année 2026','↘')}${stat('Résultat provisoire','84 300,000','Revenus moins dépenses · exemple','◈')}${stat('À payer aux fournisseurs',money(open),'Calculé à partir des factures affichées','▤')}</div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Vue d’ensemble annuelle</h2><p>Évolution mensuelle · 2026</p></div><div class="legend"><span class="dot"></span> Revenus <span class="dot dark"></span> Dépenses</div></div>${chart()}</section><section class="panel"><div class="panelhead"><div><h2>À suivre</h2><p>Les points importants en un coup d’œil</p></div></div><div class="notice"><div class="circle">▤</div><div><b>${invoices.filter(i=>i.status!=='Payée').length} factures à suivre</b><small>Vérifiez les montants et échéances</small></div></div><div class="notice"><div class="circle">✓</div><div><b>${tasks.filter(t=>!t.done).length} tâches à terminer</b><small>Organisez les prochaines actions</small></div></div><button class="link" data-go="tasks">Voir toutes les tâches →</button></section></div><div class="lower"><section class="panel"><div class="panelhead"><div><h2>Factures récentes</h2><p>Suivez les factures de vos fournisseurs</p></div><button class="link" data-go="invoices">Tout voir →</button></div>${table()}</section><section class="panel"><div class="panelhead"><div><h2>À faire</h2><p>Vos priorités du moment</p></div><button class="link" data-go="tasks">Tout voir →</button></div>${taskList()}</section></div>`}else if(page==='invoices'){html=heading('Factures fournisseurs','Toutes vos factures, documents PDF et échéances au même endroit.')+`<section class="panel"><div class="panelhead"><div><h2>Liste des factures</h2><p>${invoices.length} factures · montants TTC</p></div></div>${table()}</section>`}else if(page==='suppliers'){let names=[...new Set(invoices.map(x=>x.supplier))];html=heading('Fournisseurs','Une vue claire des partenaires et des montants à régler.')+`<section class="panel"><div class="panelhead"><div><h2>Vos fournisseurs</h2><p>Liste issue des factures de démonstration</p></div></div><table><thead><tr><th>Fournisseur</th><th>Factures</th><th>Reste à payer</th></tr></thead><tbody>${names.map(n=>`<tr><td><b>${esc(n)}</b></td><td>${invoices.filter(x=>x.supplier===n).length}</td><td>${money(invoices.filter(x=>x.supplier===n&&x.status!=='Payée').reduce((a,x)=>a+Number(x.amount),0))} DT</td></tr>`).join('')}</tbody></table></section>`}else if(page==='tasks'){html=heading('Tâches','Organisez les actions de votre équipe.')+`<section class="panel"><div class="panelhead"><div><h2>Liste des tâches</h2><p>Cochez une tâche pour la marquer terminée</p></div></div>${taskList()}<form id="taskForm" style="display:flex;gap:10px;margin-top:20px"><input name="task" required placeholder="Ajouter une tâche…"><button class="btn primary">Ajouter</button></form></section>`}else if(page==='stats'){html=heading('Statistiques annuelles','Analysez l’évolution de votre activité sur l’année.')+`<div class="cards">${stat('Revenus · 2026','248 500,000','Données fictives','↗')}${stat('Dépenses · 2026','164 200,000','Données fictives','↘')}${stat('Résultat provisoire','84 300,000','Revenus moins dépenses','◈')}${stat('Moyenne mensuelle','20 708,333','Revenus annuels ÷ 12','▥')}</div><section class="panel"><div class="panelhead"><div><h2>Revenus et dépenses</h2><p>Répartition mensuelle indicative · 2026</p></div><div class="legend"><span class="dot"></span> Revenus <span class="dot dark"></span> Dépenses</div></div>${chart()}</section><p class="footer">Graphique et chiffres illustratifs, indépendants des factures saisies dans la démo.</p>`}else{html=heading('Situation financière','Comprendre les éléments de votre bilan.')+`<div class="grid"><section class="panel"><h2>Actif</h2><p style="margin-top:10px;line-height:1.8">Ce que l’entreprise possède ou ce qui lui est dû : trésorerie, équipements, stock et créances clients.</p><div class="notice" style="margin-top:20px"><div><b>À définir avec votre comptable</b><small>Les soldes réels et les écritures comptables seront nécessaires.</small></div></div></section><section class="panel"><h2>Passif et capitaux propres</h2><p style="margin-top:10px;line-height:1.8">Les dettes de l’entreprise et les ressources apportées ou conservées par les propriétaires.</p><div class="notice" style="margin-top:20px"><div><b>Fournisseurs à payer : ${money(open)} DT</b><small>Montant de démonstration issu des factures affichées.</small></div></div></section></div><section class="panel"><h2>Un bilan fiable commence par des données complètes</h2><p style="margin-top:10px;line-height:1.8">Cette page présente le concept. Un bilan comptable nécessite un plan comptable, des écritures équilibrées, les soldes d’ouverture et la validation du comptable.</p></section>`}content.innerHTML=html+`<div class="footer">Prototype interactif · Chiffres fictifs · Pas un logiciel comptable de production</div>`;document.getElementById('add').onclick=()=>document.getElementById('modal').classList.add('show');document.getElementById('reset').onclick=()=>{if(confirm('Réinitialiser les données de démonstration ?')){invoices=structuredClone(initial);tasks=[{name:'Vérifier la facture Services Méditerranée',info:'Comptabilité · Aujourd’hui',done:false},{name:'Préparer les paiements fournisseurs',info:'Fathi · Demain',done:false},{name:'Classer les factures du mois',info:'Administration · 31 octobre',done:false}];save();render()}};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>{invoices[x.dataset.status].status=x.value;save();render()});document.querySelectorAll('[data-pdf]').forEach(x=>x.onclick=()=>{let a=document.createElement('a');a.href=invoices[x.dataset.pdf].pdf;a.download=invoices[x.dataset.pdf].pdfName||'facture.pdf';a.click()});document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{tasks[x.dataset.task].done=x.checked;save();render()});let tf=document.getElementById('taskForm');if(tf)tf.onsubmit=e=>{e.preventDefault();tasks.push({name:new FormData(tf).get('task'),info:'Nouvelle tâche · Démonstration',done:false});save();render()}}function save(){localStorage.setItem('tecInvoices',JSON.stringify(invoices));localStorage.setItem('tecTasks',JSON.stringify(tasks))}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('invoiceForm').onsubmit=async e=>{e.preventDefault();let form=e.target,f=new FormData(form),file=f.get('pdf');if(file&&file.size>2*1024*1024){alert('Le PDF doit être inférieur à 2 Mo.');return}if(file&&file.size&&file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){alert('Veuillez sélectionner un fichier PDF.');return}let pdf=file&&file.size?await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)}):null;let item={supplier:f.get('supplier'),number:f.get('number'),amount:Number(f.get('amount')),date:f.get('date'),due:f.get('due'),status:'À payer',pdf,pdfName:file&&file.size?file.name:null};if(invoices.some(i=>i.supplier.toLowerCase()===item.supplier.toLowerCase()&&i.number.toLowerCase()===item.number.toLowerCase())){alert('Cette facture existe déjà pour ce fournisseur.');return}invoices.unshift(item);try{save()}catch(err){invoices.shift();alert('Espace de stockage insuffisant. Essayez un PDF plus petit ou réinitialisez la démo.');return}form.reset();document.getElementById('modal').classList.remove('show');page='invoices';render()};render();
</script></body></html>
